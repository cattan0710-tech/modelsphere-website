name: Website checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:generate
      - run: git diff --exit-code -- src/css/tokens.css
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm community:check
      - run: pnpm content:check
      - run: DOCS_SOURCE_MODE=mock pnpm content:check
      - run: pnpm blog:check
      - run: BLOG_SOURCE_MODE=mock pnpm blog:check
      - name: Unit tests
        run: pnpm test
  static-site:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        mode: [preview, release]
    env:
      SITE_ORIGIN: http://localhost:4173
      BLOG_SOURCE_MODE: content
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build mock preview
        run: pnpm build:docs-preview
        env:
          DOCS_SOURCE_MODE: mock
          BLOG_SOURCE_MODE: mock
      - name: Build release with published content
        if: matrix.mode == 'release'
        run: pnpm build
      - name: Verify preview artifact
        if: matrix.mode == 'preview'
        run: pnpm artifacts:check
        env:
          SITE_BUILD_TARGET: preview
          DOCS_SOURCE_MODE: mock
          BLOG_SOURCE_MODE: mock
      - name: Verify release artifact
        if: matrix.mode == 'release'
        run: pnpm artifacts:check
        env:
          SITE_BUILD_TARGET: release
          DOCS_SOURCE_MODE: content
          BLOG_SOURCE_MODE: content
          SITE_PUBLISH_EXAMPLES: 'false'
      - run: docker build -f infra/docker/Dockerfile -t modelsphere-docs-test .
      - run: docker run -d --name docs-test -p 127.0.0.1:4173:8080 modelsphere-docs-test
      - name: Wait for Nginx
        run: curl --retry 20 --retry-all-errors --retry-delay 1 --fail http://localhost:4173/docs
      - name: Browser acceptance on Nginx
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:4173
          TEST_DOCS_MODE: ${{ matrix.mode == 'preview' && 'mock' || 'content' }}
          TEST_BLOG_SOURCE: ${{ matrix.mode == 'preview' && 'mock' || 'content' }}
          TEST_BUILD_TARGET: ${{ matrix.mode }}
      - name: Save verified site for the test image
        if: matrix.mode == 'release' && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-site-${{ github.sha }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.mode }}
          path: |
            reports/
            playwright-report/
            test-results/
      - run: docker rm -f docs-test
        if: always()
  pages-site:
    name: Pages site (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        mode: [preview, release]
    env:
      SITE_ORIGIN: https://modelsphere.tech
      SITE_BASE_URL: /
      BLOG_SOURCE_MODE: content
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build Pages preview
        run: pnpm build:docs-preview
        env:
          DOCS_SOURCE_MODE: mock
          BLOG_SOURCE_MODE: mock
      - name: Build Pages release after mock
        if: matrix.mode == 'release'
        run: pnpm build
      - name: Verify Pages artifact
        run: pnpm artifacts:check
        env:
          SITE_BUILD_TARGET: ${{ matrix.mode }}
          DOCS_SOURCE_MODE: ${{ matrix.mode == 'preview' && 'mock' || 'content' }}
          BLOG_SOURCE_MODE: ${{ matrix.mode == 'preview' && 'mock' || 'content' }}
          SITE_PUBLISH_EXAMPLES: 'false'
      - run: docker build --build-arg SITE_BASE_URL="$SITE_BASE_URL" -f infra/docker/Dockerfile -t modelsphere-pages-test .
      - run: docker run -d --name pages-test -p 127.0.0.1:4173:8080 modelsphere-pages-test
      - name: Wait for Pages candidate
        run: curl --retry 20 --retry-all-errors --retry-delay 1 --fail "http://localhost:4173${SITE_BASE_URL}"
      - name: Browser acceptance under Pages path
        run: pnpm test:pages
        env:
          E2E_BASE_URL: http://localhost:4173
          TEST_DOCS_MODE: ${{ matrix.mode == 'preview' && 'mock' || 'content' }}
          TEST_BLOG_SOURCE: ${{ matrix.mode == 'preview' && 'mock' || 'content' }}
          TEST_BUILD_TARGET: ${{ matrix.mode }}
      - name: Package the verified release
        if: matrix.mode == 'release' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-acceptance-${{ matrix.mode }}
          path: |
            reports/
            playwright-report/
            test-results/
      - run: docker rm -f pages-test
        if: always()
  publish-test-image:
    name: Publish develop image to Aliyun ACR
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: [quality, static-site, pages-site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: acr-develop
      cancel-in-progress: false
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY || 'crpi-m351n5ri6g6oankf.cn-beijing.personal.cr.aliyuncs.com' }}
      ACR_REPOSITORY: ct-modelsphere/modelsphere-website
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check ACR credentials
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::Configure ACR_USERNAME and ACR_PASSWORD in repository Actions secrets."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: docker-site-${{ github.sha }}
          path: build/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Ensure candidate is still develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEVELOP_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq '.object.sha')
          if [ "$DEVELOP_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer develop commit exists; refusing to publish the older candidate."
            exit 1
          fi
      - name: Push the verified site as a multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            SITE_BASE_URL=/
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:develop
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, static-site, pages-site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure candidate is still main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PAGES_MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$PAGES_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; refusing to deploy the older candidate."
            exit 1
          fi
      - uses: actions/configure-pages@v6.0.0
      - name: Verify Pages custom domain
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PAGES_DOMAIN: modelsphere.tech
        run: |
          PAGES_DOMAIN=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname')
          if [ "$PAGES_DOMAIN" != "$EXPECTED_PAGES_DOMAIN" ]; then
            echo "Configure the Pages custom domain as $EXPECTED_PAGES_DOMAIN before publishing."
            exit 1
          fi
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify published version and routes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-deployment.mjs "$PAGES_URL" "$GITHUB_SHA"
